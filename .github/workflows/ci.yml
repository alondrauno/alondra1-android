name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.check.outputs.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: check
        run: echo "project=$([ -f gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build-and-test:
    # Skipped until the Android Studio project (with its Gradle wrapper) is committed.
    needs: detect
    if: needs.detect.outputs.project == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: chmod +x gradlew
      - name: Lint, JVM tests (unit, Room, Robolectric UI) of both flavors, dev APK, release bundles
        run: ./gradlew lintProdDebug testProdDebugUnitTest testDevDebugUnitTest assembleDevDebug bundleProdRelease bundleDevRelease --stacktrace
      - name: Each bundle contains only its own environment's endpoints
        run: |
          scripts/check-environment.sh prod app/build/outputs/bundle/prodRelease/app-prod-release.aab
          scripts/check-environment.sh dev app/build/outputs/bundle/devRelease/app-dev-release.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/screens/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk

  instrumented:
    # Dialog flows with text entry run on an emulator (Robolectric cannot drive them).
    needs: detect
    if: needs.detect.outputs.project == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: chmod +x gradlew && ./gradlew connectedProdDebugAndroidTest

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check relative links in Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # gitleaks CLI (MIT), pinned and checksum-verified. The gitleaks GitHub Action needs a paid license for
      # repositories owned by an organization.
      - name: Secrets scan (gitleaks)
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --exit-code 1 .
